tasks:
  installDeps:
    name: Install dependencies
    description: Install workspace dependencies with npm.
    command: |
      npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build all apps and packages with Turborepo.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  web:
    name: web
    description: Next.js dev server for the web app.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --dont-wait --admission creator_only --name "web"
        npm run dev --workspace=web -- --hostname 0.0.0.0
      ready: |
        curl -sf http://localhost:3000 > /dev/null

  docs:
    name: docs
    description: Next.js dev server for the docs app.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3001 --dont-wait --admission creator_only --name "docs"
        npm run dev --workspace=docs -- --hostname 0.0.0.0
      ready: |
        curl -sf http://localhost:3001 > /dev/null
