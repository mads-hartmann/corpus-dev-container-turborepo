tasks:
  installDeps:
    name: Install dependencies
    description: Install the locked npm workspace dependencies.
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build all Turborepo apps and packages.
    command: npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  web:
    name: Web
    description: Run the web Next.js development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Web"
        npm run dev --workspace web -- --hostname 0.0.0.0
      ready: curl -f http://localhost:3000

  docs:
    name: Docs
    description: Run the docs Next.js development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3001 --admission creator_only --name "Docs"
        npm run dev --workspace docs -- --hostname 0.0.0.0
      ready: curl -f http://localhost:3001
